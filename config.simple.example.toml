[server]
listen = "0.0.0.0:8080"
https_listen = "0.0.0.0:8443"
max_in_flight_requests = 1024
listen_backlog = 1024
max_body_bytes = 8388608
max_fastcgi_response_bytes = 8388608
request_timeout_ms = 30000
shutdown_grace_period_s = 15
json_logs = false

[metrics]
listen = "127.0.0.1:9091"

[static_cache]
enabled = true
max_total_bytes = 67108864
max_file_bytes = 1048576
max_entries = 4096
revalidate_after_ms = 1000

[websocket]
path = "/_rws/ws"
outbound_queue_messages = 64
outbound_queue_bytes = 262144
scheduler_quantum_bytes = 16384
per_turn_messages = 16

# Uncomment after installing a certificate.
# [tls]
# cert_file = "/etc/rws-simple/tls/fullchain.pem"
# key_file = "/etc/rws-simple/tls/privkey.pem"

[[sites]]
host = "example.test"
mode = "static"
root = "/var/www/example.test/public"
index = "index.html"
php = true
php_fpm = "unix:/run/php/php8.3-fpm.sock"
# Send requests for paths that do not exist to this PHP script.
# front_controller = "index.php"
# Optional per-site logs. Error logs contain requests with status 4xx or 5xx.
# access_log = "/var/log/rws-simple/example.test.access.log"
# error_log = "/var/log/rws-simple/example.test.error.log"

