[server]
listen = "0.0.0.0:80"
https_listen = "0.0.0.0:443"
max_in_flight_requests = 1024
listen_backlog = 1024
max_body_bytes = 8388608
request_timeout_ms = 30000
shutdown_grace_period_s = 15
json_logs = false

[metrics]
listen = "127.0.0.1:9091"

[static_cache]
enabled = true
max_total_bytes = 67108864
max_file_bytes = 1048576
max_entries = 4096
revalidate_after_ms = 1000

[websocket]
path = "/_rsw/ws"
outbound_queue_messages = 64
outbound_queue_bytes = 262144
scheduler_quantum_bytes = 16384
per_turn_messages = 16

[tls]
cert_file = "/etc/rsw-simple/tls/fullchain.pem"
key_file = "/etc/rsw-simple/tls/privkey.pem"

[[sites]]
host = "webtodate.nl"
mode = "static"
root = "/var/www/webtodate.nl/public"
index = "index.php"
php = true
php_fpm = "unix:/run/php/php8.5-fpm.sock"
front_controller = "index.php"
access_log = "/var/log/rsw-simple/webtodate.nl.access.log"
error_log = "/var/log/rsw-simple/webtodate.nl.error.log"

[[sites]]
host = "bench.local"
mode = "static"
root = "/var/www/webtodate.nl/public"
index = "robots.txt"
php = false
