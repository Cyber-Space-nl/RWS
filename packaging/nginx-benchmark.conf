server {
    listen 18081;
    listen [::]:18081;
    server_name bench.local;

    root /var/www/webtodate.nl/public;
    access_log off;
    error_log /var/log/nginx/rsw-bench.error.log crit;
    etag off;

    location / {
        try_files $uri =404;
        add_header X-Content-Type-Options nosniff always;
    }
}
