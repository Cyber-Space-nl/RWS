[server]
listen = "127.0.0.1:18082"
https_listen = "127.0.0.1:18443"
max_in_flight_requests = 128
listen_backlog = 256
max_body_bytes = 1048576
request_timeout_ms = 5000
shutdown_grace_period_s = 5
json_logs = false

[metrics]
listen = "127.0.0.1:19092"

[static_cache]
enabled = true
max_total_bytes = 1048576
max_file_bytes = 65536
max_entries = 128
revalidate_after_ms = 1000

[websocket]
path = "/_rsw/ws"
outbound_queue_messages = 16
outbound_queue_bytes = 65536
scheduler_quantum_bytes = 4096
per_turn_messages = 8

[[sites]]
host = "bench.local"
mode = "static"
root = "/var/www/webtodate.nl/public"
index = "robots.txt"
php = false
