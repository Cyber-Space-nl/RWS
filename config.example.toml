[server]
listen = "0.0.0.0:8080"
https_listen = "0.0.0.0:8443"
# With [tls], redirect HTTP to HTTPS (308); ignored without TLS.
redirect_http_to_https = true
max_in_flight_requests = 1024
listen_backlog = 1024
max_body_bytes = 8388608
max_fastcgi_response_bytes = 8388608
request_timeout_ms = 30000
shutdown_grace_period_s = 15
json_logs = false

[metrics]
listen = "127.0.0.1:9091"

[static_cache]
enabled = true
max_total_bytes = 67108864
max_file_bytes = 1048576
max_entries = 4096
revalidate_after_ms = 1000

[websocket]
path = "/_rws/ws"
outbound_queue_messages = 64
outbound_queue_bytes = 262144
scheduler_quantum_bytes = 16384
per_turn_messages = 16

[adaptive]
enabled = false
interval_ms = 500
min_quantum_bytes = 4096
max_quantum_bytes = 131072
queue_high_watermark = 128

# Uncomment after installing a certificate.
# [tls]
# cert_file = "/etc/rws/tls/fullchain.pem"
# key_file = "/etc/rws/tls/privkey.pem"

[[sites]]
host = "example.test"
mode = "static"
root = "/var/www/example.test/public"
index = "index.html"
# Optional static-file features (both default to false):
# gzip = true
# directory_listing = true  # Linux only; exposes visible directory entries
php = true
php_fpm = "unix:/run/php/php8.3-fpm.sock"
# For local systemd-managed PHP-FPM, configure matching startup ordering separately:
# sudo bash scripts/configure-php-fpm.sh php8.3-fpm.service
# Send requests for paths that do not exist to this PHP script.
# front_controller = "index.php"
# Optional per-site logs. Error logs contain requests with status 4xx or 5xx.
# access_log = "/var/log/rws/example.test.access.log"
# error_log = "/var/log/rws/example.test.error.log"

# Optional separate application below this site's URL prefix. Basic auth requires [tls].
# [[sites.locations]]
# path = "/database/"
# root = "/opt/phpmyadmin"
# index = "index.php"
# php = true
# php_fpm = "unix:/run/php/phpmyadmin.sock"
# noindex = true
# deny_paths = ["/libraries", "/setup", "/vendor", "/templates", "/examples", "/doc", "/sql"]
# deny_files = ["config*.php", "composer.json", "composer.lock", "package.json", "yarn.lock"]
# [sites.locations.basic_auth]
# realm = "Database administration"
# htpasswd_file = "/etc/rws/private/phpmyadmin.htpasswd"

# Optional HTTP reverse proxy site:
# [[sites]]
# host = "app.example.test"
# mode = "proxy"
# upstream = "http://127.0.0.1:3000"

