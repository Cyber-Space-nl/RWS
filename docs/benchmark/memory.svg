<svg xmlns="http://www.w3.org/2000/svg" width="960" height="540" viewBox="0 0 960 540" role="img" aria-labelledby="title desc">
  <title id="title">RWS memory stability over 20 million requests</title>
  <desc id="desc">RWS rose from 6.55 MiB cold RSS to 11.11 MiB after 20 million static keep-alive requests. Growth from 15 to 20 million requests was only 4 KiB.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#111c33"/><stop offset="1" stop-color="#07101f"/></linearGradient>
    <linearGradient id="area" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#4ade80" stop-opacity=".32"/><stop offset="1" stop-color="#22c55e" stop-opacity=".02"/></linearGradient>
    <filter id="glow"><feGaussianBlur stdDeviation="4" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>
  <rect width="960" height="540" rx="24" fill="url(#bg)"/>
  <circle cx="900" cy="40" r="120" fill="#22c55e" opacity=".07"/><circle cx="30" cy="520" r="150" fill="#3b82f6" opacity=".05"/>
  <text x="48" y="54" fill="#f8fafc" font-family="Inter,Segoe UI,sans-serif" font-size="27" font-weight="700">RWS memory stability</text>
  <text x="48" y="82" fill="#94a3b8" font-family="Inter,Segoe UI,sans-serif" font-size="15">Cold-start run · 20 million static keep-alive requests</text>
  <g stroke="#334155" stroke-width="1"><path d="M110 400H900"/><path d="M110 330H900"/><path d="M110 260H900"/><path d="M110 190H900"/><path d="M110 120H900"/></g>
  <g fill="#94a3b8" font-family="Inter,Segoe UI,sans-serif" font-size="13" text-anchor="end"><text x="98" y="405">0</text><text x="98" y="335">3</text><text x="98" y="265">6</text><text x="98" y="195">9</text><text x="98" y="125">12 MiB</text></g>
  <path d="M130 247.2L315 158.5L500 141.5L685 141L870 140.7L870 400L130 400Z" fill="url(#area)"/>
  <path d="M130 247.2L315 158.5L500 141.5L685 141L870 140.7" fill="none" stroke="#22c55e" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
  <g fill="#22c55e" filter="url(#glow)"><circle cx="130" cy="247.2" r="7"/><circle cx="315" cy="158.5" r="7"/><circle cx="500" cy="141.5" r="7"/><circle cx="685" cy="141" r="7"/><circle cx="870" cy="140.7" r="7"/></g>
  <g fill="#cbd5e1" font-family="Inter,Segoe UI,sans-serif" font-size="14" font-weight="600" text-anchor="middle"><text x="130" y="432">cold</text><text x="315" y="432">5M</text><text x="500" y="432">10M</text><text x="685" y="432">15M</text><text x="870" y="432">20M</text></g>
  <g font-family="Inter,Segoe UI,sans-serif" font-weight="700"><rect x="742" y="154" width="154" height="34" rx="17" fill="#14532d"/><text x="819" y="177" text-anchor="middle" fill="#dcfce7" font-size="16">11.11 MiB RSS</text><text x="130" y="229" text-anchor="middle" fill="#f8fafc" font-size="15">6.55 MiB</text></g>
  <rect x="172" y="462" width="616" height="54" rx="17" fill="#1e293b"/>
  <circle cx="201" cy="489" r="7" fill="#22c55e"/><text x="218" y="486" fill="#f8fafc" font-family="Inter,Segoe UI,sans-serif" font-size="14" font-weight="700">Plateau: +4 KiB from 15M to 20M</text><text x="218" y="505" fill="#94a3b8" font-family="Inter,Segoe UI,sans-serif" font-size="12">Separate connection churn: 40.3 MiB peak · 36.7 MiB after worker exit</text>
</svg>
