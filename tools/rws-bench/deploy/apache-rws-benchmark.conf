<VirtualHost *:18082>
    ServerName bench.local
    DocumentRoot /var/www/webtodate.nl/public

    CustomLog /dev/null combined
    ErrorLog /var/log/apache2/rws-benchmark.error.log
    LogLevel crit

    KeepAlive On
    MaxKeepAliveRequests 1000000
    KeepAliveTimeout 620
    FileETag None
    Header always set X-Content-Type-Options "nosniff"

    <Directory /var/www/webtodate.nl/public>
        Options -Indexes
        AllowOverride None
        Require all granted
    </Directory>
</VirtualHost>
