server {
    listen 18081 backlog=1024;
    listen [::]:18081 backlog=1024;
    server_name bench.local;

    root /var/www/webtodate.nl/public;
    access_log off;
    error_log /var/log/nginx/rws-bench.error.log crit;
    etag off;
    keepalive_timeout 620s;
    keepalive_requests 1000000;

    location / {
        try_files $uri =404;
        add_header X-Content-Type-Options nosniff always;
    }
}
