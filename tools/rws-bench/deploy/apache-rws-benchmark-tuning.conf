ListenBacklog 1024
KeepAlive On
MaxKeepAliveRequests 1000000
KeepAliveTimeout 620

<IfModule mpm_event_module>
    StartServers 2
    MinSpareThreads 25
    MaxSpareThreads 75
    ThreadLimit 64
    ThreadsPerChild 25
    ServerLimit 8
    MaxRequestWorkers 200
    AsyncRequestWorkerFactor 8
</IfModule>
