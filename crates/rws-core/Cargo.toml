[package]
name = "rws-core"
description = "Shared server core for Rust WebServer"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
authors.workspace = true
repository.workspace = true

[features]
default = []
comfy = ["dep:reqwest"]

[dependencies]
anyhow = "1.0"
axum = { version = "0.8.9", features = ["ws"] }
axum-server = { version = "0.8.0", features = ["tls-rustls"] }
bytes = "1.10"
fastcgi-client = { version = "0.12.0", features = ["http", "tokio"] }
futures-util = "0.3"
http = "1.3"
hyper-util = { version = "0.1", features = ["tokio"] }
mime_guess = "2.0"
percent-encoding = "2.3"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "stream"], optional = true }
serde = { version = "1.0", features = ["derive"] }
socket2 = "0.6"
tokio = { version = "1.47", features = ["fs", "macros", "net", "rt-multi-thread", "signal", "sync", "time"] }
tokio-util = { version = "0.7", features = ["io"] }
toml = "0.9"
tower = { version = "0.5", features = ["limit", "timeout"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt", "json"] }

[target.'cfg(target_os = "linux")'.dependencies]
rustix = { version = "1.1.6", features = ["fs"] }

[dev-dependencies]
tempfile = "3.20"

