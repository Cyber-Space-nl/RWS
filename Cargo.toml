[workspace]
members = [
    "crates/rws-core",
    "crates/rws",
    "tools/rws-ws-load",
    "tools/rws-bench",
]
resolver = "2"

[workspace.package]
version = "0.1.0-beta.3"
edition = "2024"
license = "MIT"
rust-version = "1.88"
authors = ["Daan Wentink"]
repository = "https://github.com/Cyber-Space-nl/RWS"

[profile.release]
lto = "fat"
codegen-units = 1
panic = "abort"
strip = "symbols"

