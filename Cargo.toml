[workspace]
members = [
    "crates/rws-core",
    "crates/rws-simple",
    "crates/rws-comfy",
    "tools/rws-ws-load",
    "tools/rws-bench",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
rust-version = "1.88"

[profile.release]
lto = "fat"
codegen-units = 1
panic = "abort"
strip = "symbols"

